<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="./img/favicon.ico" />

    <meta property="og:site_name" content="RISA MASUDA" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" type="text/css" href="./css/reset.css" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
  </head>

  <body>
    <div style="display: flex">
      <div class="sidebar">
        <h1>ロゴ</h1>
        <nav>
          <ul>
            <li><a href="top.html" class="ajax-link">トップ</a></li>
            <li><a href="profile.html" class="ajax-link">自己紹介</a></li>
          </ul>
        </nav>
      </div>
      <!-- /sidebar -->

      <main id="content-area"></main>
    </div>

    <script>
      document.querySelectorAll(".ajax-link").forEach((link) => {
        link.onclick = async (e) => {
          e.preventDefault();
          const res = await fetch(link.href);
          const html = await res.text();

          // 読み込んだHTMLからbodyの中身だけ抽出して入れ替え
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");
          document.getElementById("content-area").innerHTML = doc.body.innerHTML;

          // URLもちゃんと変える（ブラウザの「戻る」も効く）
          window.history.pushState(null, "", link.href);
        };
      });
    </script>
  </body>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="./js/script.js"></script>
</html>
