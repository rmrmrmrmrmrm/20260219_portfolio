# 1) リポジトリルートの静的ポートフォリオ（index.html / css / img / js）をサイトのトップに配置
# 2) Vue（Vite）のビルドは /vite/ 配下に配置（従来トップと共存）
# リポジトリ Settings → Pages で Source を「GitHub Actions」にしてください。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 0_portfolio_v02_vite/package-lock.json

      - name: Install (Vue)
        working-directory: 0_portfolio_v02_vite
        run: npm ci

      - name: Build Vue + assemble static site at root
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          cd 0_portfolio_v02_vite
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            VUE_BASE="/vite/"
          else
            VUE_BASE="/$REPO_NAME/vite/"
          fi
          npm run build -- --base="$VUE_BASE"
          cp dist/index.html dist/404.html
          cd ..
          mkdir -p _site
          cp index.html _site/
          cp -r css img _site/
          if [ -d js ]; then cp -r js _site/; fi
          mkdir -p _site/vite
          cp -r 0_portfolio_v02_vite/dist/. _site/vite/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
